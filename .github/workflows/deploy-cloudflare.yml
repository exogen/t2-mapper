name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

# Serialize deploys (and the asset-metadata backfill, which shares this
# group): a running deploy always finishes cleanly, and only the newest
# queued push deploys after it.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # The secrets context isn't available in step-level `if`, so evaluate
      # the check here. Boolean only — no secret material in job env.
      HAS_PURGE_SECRETS: ${{ secrets.CLOUDFLARE_PURGE_TOKEN != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, required by git-restore-mtime below.
          fetch-depth: 0

      # aws s3 sync decides what to upload by size + mtime, and a fresh
      # checkout stamps every file with clone time — which would re-upload
      # (and purge) all ~19k game assets on every deploy. Restoring each
      # file's mtime to its last commit time makes the sync incremental and
      # the purge list accurate.
      - uses: chetan/git-restore-mtime-action@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: /
          GAME_ASSETS_BASE_URL: https://assets.tribes2.online/game/base/
          RELAY_URL: ${{ secrets.RELAY_URL }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}

      - name: Check the Cloudflare account id is set
        # An empty value would build https://.r2.cloudflarestorage.com and
        # the AWS CLI would report it as an opaque connection failure.
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync game assets to R2
        # One `aws s3 sync` pass per Content-Type, driven by
        # scripts/lib/assetMetadata.ts — the same table the backfill uses, so
        # an object's headers do not depend on which job wrote it. The CLI's
        # own guesses are wrong for the game's formats (.dts reads as DTS
        # audio, .dif as DV video) and absent for most of them, which is why
        # nothing may be guessed here. The run fails if any extension has no
        # entry in the table, rather than shipping it untyped.
        #
        # It also writes a brotli sibling next to every changed .dts, .dif
        # and .ter (<name>.dts.br, Content-Encoding: br). Nothing serves
        # these right now — a Cloudflare compression rule on the asset host
        # handles compression since the asset worker was retired — but they
        # are kept so a worker can be brought back without recompressing the
        # whole corpus first.
        run: |
          set -o pipefail
          npx tsx --tsconfig tsconfig.node.json scripts/sync-assets.ts \
            --bucket s3://t2-assets/game/base/ \
            --report r2-sync-output.txt \
            | tee sync-console.txt
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          # Brotli runs on libuv's threadpool, which defaults to 4 threads.
          # The interiors corpus is 262 MB, so this is what keeps a first
          # run to minutes rather than tens of minutes.
          UV_THREADPOOL_SIZE: "8"

      - name: Purge changed assets from Cloudflare cache
        # Skips (visibly) until the purge secrets are configured.
        if: env.HAS_PURGE_SECRETS == 'true'
        run: npx tsx --tsconfig tsconfig.node.json scripts/purge-changed-assets.ts r2-sync-output.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Remove game assets from Pages deploy
        run: rm -rf docs/base

      # The t2-mapper Pages project must already exist; bootstrap a new one
      # manually with: wrangler pages project create t2-mapper --production-branch=main
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=t2-mapper
