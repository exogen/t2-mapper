name: Deploy asset worker

# The worker that serves assets.tribes2.online and swaps in the brotli
# sibling for clients that accept it (worker/src/index.js).
#
# Separate from the Pages deploy on purpose: it only runs when the worker
# itself changes, so an ordinary asset push does not redeploy it, and a
# worker failure cannot take the asset sync down with it.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  # So it can be rolled forward by hand after a secret or binding change.
  workflow_dispatch:

# One worker deploy at a time; a queued push supersedes an older one.
concurrency:
  group: cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The parser that decides whether a client gets the compressed copy is
      # the one piece of real logic here, and handing brotli to a client that
      # refused it is silent corruption. Do not deploy on a red test.
      - name: Test the worker
        run: npx vitest run worker

      # wrangler-action installs wrangler itself, so it is not a dependency
      # of the app. Same token and account as the Pages deploy.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
