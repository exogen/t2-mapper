name: Backfill R2 asset metadata

# Manually-run maintenance task: re-stamps Cache-Control metadata on every
# object in the game assets bucket. Needed once after introducing cache
# headers (the deploy sync only sets metadata on objects it uploads), or
# whenever the cache policy changes.

on:
  workflow_dispatch:
    inputs:
      cache-control:
        description: Cache-Control value to stamp on all objects
        required: true
        default: "public, max-age=3600, s-maxage=31536000"
      dry-run:
        description: Only list the objects that would be updated
        type: boolean
        default: false

# Shares the deploy workflow's group so the backfill never rewrites object
# metadata while a deploy sync is running.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Re-stamp Cache-Control on all game assets
        run: |
          args=(--recursive --metadata-directive REPLACE --cache-control "$CACHE_CONTROL")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dryrun)
          fi
          aws s3 cp s3://t2-assets/game/base/ s3://t2-assets/game/base/ "${args[@]}"
        env:
          CACHE_CONTROL: ${{ inputs.cache-control }}
          DRY_RUN: ${{ inputs.dry-run }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
