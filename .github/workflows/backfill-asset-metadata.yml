name: Backfill R2 asset metadata

# Manually-run maintenance task: rewrites Content-Type and Cache-Control on
# every object in the game assets bucket, from the same table the deploy sync
# uses (scripts/lib/assetMetadata.ts). Run it after changing that table, or to
# repair objects an older job wrote.
#
# Safe to run at any time. It defaults to a dry run, and a real run always
# writes the COMPLETE metadata set: `--metadata-directive REPLACE` replaces
# every system header, so a job that passes only some of them silently drops
# the rest. That is what an earlier version of this workflow did with
# --cache-control alone, which is how the bucket lost Content-Type.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write the headers (leave unchecked for a dry run)
        type: boolean
        default: false
      max_age:
        description: >-
          Override max-age, in seconds. Leave BLANK to use the value in
          scripts/lib/assetMetadata.ts, which is the source of truth.
        type: string
        default: ""
      stale_while_revalidate:
        description: >-
          Override stale-while-revalidate, in seconds. Leave BLANK to use the
          value in scripts/lib/assetMetadata.ts.
        type: string
        default: ""

# Shares the deploy workflow's group so the backfill never rewrites object
# metadata while a deploy sync is running.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      # The secrets context isn't available in step-level `if`, so evaluate
      # the check here. Boolean only — no secret material in job env.
      HAS_PURGE_SECRETS: ${{ secrets.CLOUDFLARE_PURGE_TOKEN != '' && secrets.CLOUDFLARE_ZONE_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the Cloudflare account id is set
        # An empty value would build https://.r2.cloudflarestorage.com and
        # the AWS CLI would report it as an opaque connection failure.
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The two overrides go through the environment rather than being
      # interpolated into the script: `${{ inputs.x }}` in a run block is
      # substituted before bash sees it, so a crafted value would run as
      # shell. The script rejects anything that is not a whole number.
      - name: Set Content-Type and Cache-Control on all game assets
        run: |
          args=(--bucket s3://t2-assets/game/base/)
          if [ -n "$MAX_AGE" ]; then args+=(--max-age "$MAX_AGE"); fi
          if [ -n "$STALE_WHILE_REVALIDATE" ]; then
            args+=(--stale-while-revalidate "$STALE_WHILE_REVALIDATE")
          fi
          npx tsx --tsconfig tsconfig.node.json \
            scripts/backfill-asset-metadata.ts \
            "${args[@]}" ${{ inputs.apply && '--apply' || '' }}
        env:
          MAX_AGE: ${{ inputs.max_age }}
          STALE_WHILE_REVALIDATE: ${{ inputs.stale_while_revalidate }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

      # An apply rewrites every object, so any edge copies carry the old
      # header. Purge by PREFIX is an Enterprise-only feature, so this purges
      # the whole zone, which every plan allows. The assets ARE edge-cached
      # (measured MISS then HIT, including .dts and .cs), so this is not
      # optional after a policy change — without it the edge keeps answering
      # with the previous Cache-Control until its own copy expires.
      - name: Purge the edge cache
        if: inputs.apply && env.HAS_PURGE_SECRETS == 'true'
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
