name: Purge edge cache

# Manually-run: purges the whole zone.
#
# The deploy purges the URLs it changed, which covers the ordinary case. This
# is for when cached entries are wrong for a reason the change list cannot
# see — a worker serving the wrong representation, say. Purge by prefix is
# Enterprise-only, so this purges everything; the cache refills on demand.
#
# Assets carry s-maxage=31536000, so a bad entry does NOT age out on its own.
# If the cause was a worker bug, DEPLOY THE FIX FIRST: purging while the
# broken code is live just lets the next request cache the same wrong answer.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why (recorded in the run, so the log says what happened)
        type: string
        required: true

concurrency:
  group: cloudflare-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge everything
        run: |
          echo "Reason: $REASON"
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        env:
          REASON: ${{ inputs.reason }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
