# fly.toml app configuration file generated for t2-relay on 2026-03-08T16:25:10-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 't2-relay'
primary_region = 'ord'
# Allow the shutdown drain to finalize in-progress demo recordings.
kill_timeout = 15

[build]
  dockerfile = 'relay/Dockerfile'

[[mounts]]
  source = 'gamedata'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8765
  auto_stop_machines = 'off'

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.http_checks]]
    interval = 30000
    timeout = 5000
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
