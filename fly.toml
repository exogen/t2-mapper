# fly.toml app configuration file generated for t2-relay on 2026-03-08T16:25:10-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 't2-relay'
primary_region = 'ord'
# Allow the shutdown drain to finalize in-progress demo recordings.
kill_timeout = 15

[env]
  RELAY_TRUST_FLY_PROXY = 'true'
  DEMO_DIR = '/data/demos'
  DEMO_CHECKPOINT_INTERVAL_MINUTES = '6'
  DEMO_CHECKPOINT_COUNT = '6'
  WATCH_STATE_PATH = '/data/watch-state.json'
  AUTH_DATABASE_PATH = '/data/accounts/app.sqlite'
  AUTH_BASE_URL = 'https://api.tribes2.online'
  AUTH_TRUSTED_ORIGINS = 'https://play.tribes2.online'

# SQLite has one authoritative volume. Do not use a blue/green or canary
# deployment that creates a second independent account database.
[deploy]
  strategy = 'immediate'

[build]
  dockerfile = 'relay/Dockerfile'

[[mounts]]
  source = 'gamedata'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8765
  auto_stop_machines = 'off'

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.http_checks]]
    interval = 30000
    timeout = 5000
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'performance-1x'
  memory = '2gb'
